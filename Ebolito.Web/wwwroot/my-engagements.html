<!doctype html>
<html lang="en" data-theme="modern">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Ebolito Engagements</title>
  <link rel="stylesheet" href="/css/site.css">
  <style>
    .shell{max-width:1050px;margin:30px auto;padding:0 20px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px;margin-bottom:14px}.meta,.actions{display:flex;gap:12px;flex-wrap:wrap}.meta{color:#555;font-size:.92rem}.actions{margin-top:12px}.status-pill{display:inline-block;border:1px solid #bbb;border-radius:999px;padding:3px 9px;font-size:.82rem}.empty{text-align:center;padding:30px;color:#666}
  </style>
</head>
<body>
  <main class="shell">
    <h1>My Engagements</h1>
    <p>Track requests you have sent through Ebolito and submit verified reviews when work is completed.</p>
    <div class="actions"><button type="button" data-refresh>Refresh</button><a href="/">Marketplace</a></div>
    <p data-status></p>
    <section data-list><div class="empty">Loading your engagements…</div></section>
  </main>
  <script src="/js/my-engagements.js"></script>
</body>
</html>
