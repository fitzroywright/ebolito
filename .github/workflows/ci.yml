name: Ebolito CI

on:
  push:
    branches:
      - main
      - resurrection/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore web host
        run: dotnet restore Ebolito.Web/Ebolito.Web.csproj

      - name: Build web host
        run: dotnet build Ebolito.Web/Ebolito.Web.csproj --no-restore --configuration Release

      - name: Restore tests
        run: dotnet restore Ebolito.Tests/Ebolito.Tests.csproj

      - name: Run tests
        run: dotnet test Ebolito.Tests/Ebolito.Tests.csproj --no-restore --configuration Release --logger "trx;LogFileName=ebolito-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ebolito-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
