name: Ebolito CI

on:
  push:
    branches:
      - main
      - resurrection/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Ebolito
        uses: actions/checkout@v4

      - name: Checkout Common.Registration
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Diagnostics
          ref: common-registration
          path: Common/Common.Registration

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore web host
        run: dotnet restore Ebolito.Web/Ebolito.Web.csproj -p:CommonRoot="${{ github.workspace }}/Common"

      - name: Build web host
        run: dotnet build Ebolito.Web/Ebolito.Web.csproj --no-restore --configuration Release -p:CommonRoot="${{ github.workspace }}/Common"

      - name: Restore tests
        run: dotnet restore Ebolito.Tests/Ebolito.Tests.csproj

      - name: Run tests
        run: dotnet test Ebolito.Tests/Ebolito.Tests.csproj --no-restore --configuration Release --logger "trx;LogFileName=ebolito-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ebolito-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  flat-common-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Ebolito
        uses: actions/checkout@v4

      - name: Checkout Common.Messaging
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Messaging
          path: Common/Common.Messaging

      - name: Checkout Common.Diagnostics
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Diagnostics
          path: Common/Common.Diagnostics

      - name: Checkout Common.Secrets
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Secrets
          path: Common/Common.Secrets

      - name: Checkout Common.Storage
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Storage
          path: Common/Common.Storage

      - name: Checkout Common.Registration
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Diagnostics
          ref: common-registration
          path: Common/Common.Registration

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore with Common workspace
        run: dotnet restore Ebolito.Web/Ebolito.Web.csproj -p:CommonRoot="${{ github.workspace }}/Common"

      - name: Build with Common workspace
        run: dotnet build Ebolito.Web/Ebolito.Web.csproj --no-restore --configuration Release -p:CommonRoot="${{ github.workspace }}/Common"
